<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:380px;max-height:500px;overflow-y:auto;font-family:'Segoe UI',sans-serif;background:#fff;color:#333}
.header{background:linear-gradient(135deg,#ee4d2d,#ff6633);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:8px}
.header h1{font-size:15px;font-weight:600}
#status{padding:12px 16px;font-size:13px;color:#666}
#result{padding:0 16px 16px}
.product-name{font-size:14px;font-weight:600;margin-bottom:8px;line-height:1.4}
.product-price{font-size:16px;color:#ee4d2d;font-weight:700;margin-bottom:8px}
.product-info{font-size:12px;color:#888;margin-bottom:12px}
.section-title{font-size:12px;font-weight:600;color:#555;margin:12px 0 8px;text-transform:uppercase}
.images-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:8px}
.images-grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;cursor:pointer;border:2px solid transparent}
.images-grid img:hover{border-color:#ee4d2d}
.images-grid img.selected{border-color:#ee4d2d;opacity:1}
.images-grid img:not(.selected){opacity:0.5}
.video-item{background:#f5f5f5;border-radius:8px;padding:8px;margin-bottom:6px;display:flex;align-items:center;gap:8px;cursor:pointer}
.video-item:hover{background:#eee}
.video-icon{font-size:20px}
.video-info{font-size:12px;color:#555}
.btn{display:block;width:100%;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
.btn-primary{background:#ee4d2d;color:#fff}
.btn-primary:hover{background:#d73211}
.btn-secondary{background:#f0f0f0;color:#333}
.btn-secondary:hover{background:#e0e0e0}
.count-badge{background:rgba(255,255,255,0.3);padding:2px 8px;border-radius:10px;font-size:12px}
#error{color:#e53e3e;padding:12px 16px;font-size:13px;display:none}
.select-bar{display:flex;gap:6px;margin-bottom:8px}
.select-bar button{font-size:11px;padding:4px 8px;border:1px solid #ddd;border-radius:4px;background:#fff;cursor:pointer}
.select-bar button:hover{background:#f5f5f5}
</style>
</head>
<body>
<div class="header">
  <span style="font-size:20px">🛒</span>
  <h1>Shopee Grabber</h1>
  <span id="badge" class="count-badge" style="display:none"></span>
</div>
<div id="status">Dang lay du lieu...</div>
<div id="error"></div>
<div id="result" style="display:none"></div>

<script src="popup.js"></script>
</body>
</html>
